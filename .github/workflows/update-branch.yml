name: Update Branch Release Sync

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v0.0.3)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: update-branch-sync
  cancel-in-progress: false

jobs:
  sync-update-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Update Branch
        uses: actions/checkout@v4
        with:
          ref: update
          path: update-branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update Metadata
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_BODY: ${{ github.event.release.body }}
          OUTPUT_DIR: update-branch
        run: |
          python3 .github/scripts/update_metadata.py

      - name: Commit and Push to update branch
        run: |
          cd update-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json version.json
          if git diff --staged --quiet; then
            echo "No changes to commit in update branch."
          else
            TARGET_TAG="${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}"
            git commit -m "chore(release): auto-update version metadata for ${TARGET_TAG}"
            git push origin update
          fi
